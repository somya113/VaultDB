<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VaultDB — Audit & Access Control</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-wrapper">
  <main class="auth-card">
    <header class="auth-header">
      <h1 class="brand-title">
        <span class="logo-mark">//</span>
        <span>VaultDB</span>
      </h1>
      <p class="auth-subtitle">Database Access & Audit Ledger</p>
    </header>

    <div id="loginError" class="alert alert-error hidden" role="alert">
      <span id="loginErrorText">Invalid credentials</span>
    </div>

    <form id="loginForm" autocomplete="on">
      <div class="form-group">
        <label for="email" class="form-label">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="admin@finance.com"
          required
          autocomplete="email"
          autofocus>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="••••••••••••"
          required
          autocomplete="current-password">
      </div>

      <button type="submit" id="loginSubmitBtn" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
        <span id="loginBtnText">Sign In</span>
      </button>
    </form>

    <div class="compliance-seal">
      <span>Immutable logging enforced via ImmuDB ledger</span>
    </div>

    <aside class="demo-box">
      <div class="demo-title">Test Accounts</div>
      <ul class="demo-list">
        <li class="demo-item" onclick="fillCredentials('admin@finance.com', 'password123')">
          <span class="demo-email">admin@finance.com</span>
          <span class="badge badge-admin">Admin</span>
        </li>
        <li class="demo-item" onclick="fillCredentials('writer@finance.com', 'password123')">
          <span class="demo-email">writer@finance.com</span>
          <span class="badge badge-writer">Writer</span>
        </li>
        <li class="demo-item" onclick="fillCredentials('reader@finance.com', 'password123')">
          <span class="demo-email">reader@finance.com</span>
          <span class="badge badge-reader">Reader</span>
        </li>
      </ul>
      <p style="margin-top: 0.5rem; color: var(--text-faint); font-size: 0.725rem; text-align: center;">
        Password for all: <code style="color: var(--text-muted); font-family: var(--font-mono);">password123</code>
      </p>
    </aside>
  </main>

  <div id="toastContainer" class="toast-container"></div>

  <script>
    function fillCredentials(email, password) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = password;
      document.getElementById('loginSubmitBtn').focus();
    }
  </script>
  <script src="js/auth.js"></script>
</body>
</html>
